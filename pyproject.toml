[tool.poetry]
name = "finanzas-personales"
version = "0.1.0"
description = "Sistema financiero personal: captura, presupuesto y análisis sobre SQLite"
authors = ["Bargof"]
readme = "README.md"
packages = [{ include = "finanzas", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
numpy = ">=1.26,<3.0"
pandas = ">=2.2,<3.0"
pydantic = ">=2.13.1,<3.0"
pydantic-settings = ">=2.13.1,<3.0"
python-dotenv = ">=1.2.2"
plotly = ">=6.7.0,<7.0"
streamlit = ">=1.57,<2.0"
pandera = ">=0.31.1,<0.32"
openpyxl = ">=3.1,<4.0"
pdfplumber = ">=0.11,<0.12"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.5"
pre-commit = ">=3.5"
ipykernel = ">=6.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --cov=src/finanzas --cov-report=term-missing"
